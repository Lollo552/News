name: News Agent

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti
  workflow_dispatch:          # per avviarlo a mano dal tasto "Run workflow"

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Controlla le notizie
        run: python agent.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOLO_IMPORTANTI: "true"
          MIN_IMPORTANZA: "3"

      - name: Salva le notizie già viste
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Aggiorna notizie viste" && git push)
